[package]
name = "sirk"
version = "0.1.0"
edition = "2024"
description = "S.I.R.K. — a provider-neutral coding-agent service"

[lib]
name = "sirk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dotenvy = "0.15"
sha2 = "0.10"
sirk-sdk = { path = "sdk/rust", version = "0.1.0" }
similar = "2"
tiny_http = "0.12"

[[bin]]
name = "sirk"
path = "src/main.rs"
