version: 1

steps:
  - tool: TREE
    output: tree

  - tool: LOOP
    input: "{{ outputs.tree }}"
    iter:

      - tool: READ
        input: "{{ loop.item }}"
        output: content

      - custom-tool: doc-name
        input:
          - "{{ loop.item }}"
        output: doc_name

      - custom-tool: file-exists
        input:
          - "{{ loop.doc_name }}"
        output: file_exists

      - tool: IF
        input: "{{ loop.file_exists }}"
        is_true:
          - tool: READ
            input: "{{ loop.doc_name }}"
            output: explain

        is_false:
          - agent: code-explainer
            input: "{{ loop.content }}"
            output: explain
          - tool: WRITE
            path: "{{ loop.doc_name }}"
            input: "{{ loop.explain }}"
            force: false

      - agent: explain-resume
        input: "{{ loop.explain }}"
        output: explain_resume

      - tool: EDIT
        path: docs/TREE.md
        operation: append
        input: "{{ loop.item }} - {{ loop.explain_resume }}"
