version: 1

steps:
  - tool: TREE
    output: tree

  - tool: LOOP
    input: "{{ outputs.tree }}"
    iter:

      - tool: READ
        input: "{{ loop.item }}"
        output: content

      - agent: code-explainer
        input: "{{ loop.content }}"
        output: explain

      - custom-tool: doc-name
        input:
          - "{{ loop.item }}"
        output: doc_name

      - tool: WRITE
        path: "{{ loop.doc_name }}"
        input: "{{ loop.explain }}"
        force: true

      - agent: explain-resume
        input: "{{ loop.explain }}"
        output: explain_resume

      - tool: EDIT
        path: docs/TREE.md
        operation: append
        input: "{{ loop.item }} - {{ loop.explain_resume }}"
