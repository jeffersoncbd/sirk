version: 1

steps:
  - tool: GIT-STATUS-TREE
    output: changed_files
  
  - tool: LOOP
    input: "{{ outputs.changed_files }}"
    iter:

      - tool: READ
        input: "{{ loop.item }}"
        output: content

      - custom-tool: doc-name
        input:
          - "{{ loop.item }}"
        output: doc_name

      - custom-tool: file-exists
        input:
          - "{{ loop.doc_name }}"
        output: doc_exists

      - tool: IF
        input: "{{ loop.doc_exists }}"
        is_true:
          - tool: READ
            input: "{{ loop.doc_name }}"
            output: current_document

          - agent: code-explainer
            input: |
              - Arquivo documentado: {{ loop.item }}
              - Documento existente a atualizar: {{ loop.doc_name }}
              - Conteúdo atual do documento:
              {{ loop.current_document }}
              - Conteúdo atual do arquivo:
              {{ loop.content }}
        is_false:
          - agent: code-explainer
            input: |
              - Nome do arquivo: {{ loop.item }}
              - Conteúdo do arquivo:
              {{ loop.content }}
            output: explain

          - tool: WRITE
            path: "{{ loop.doc_name }}"
            input: "{{ loop.explain }}"

      - tool: READ
        input: "{{ loop.doc_name }}"
        output: document

      - agent: explain-resume
        input: "{{ loop.document }}"
        output: explain_resume

      - tool: READ
        input: docs/TREE.md
        output: tree_content
        version-output: tree_version

      - custom-tool: line-exists-by-prefix
        input:
          - "{{ loop.tree_content }}"
          - "{{ loop.item }} - "
        output: tree_line_exists

      - tool: IF
        input: "{{ loop.tree_line_exists }}"
        is_true:
          - custom-tool: find-line-by-prefix
            input:
              - "{{ loop.tree_content }}"
              - "{{ loop.item }} - "
            output: tree_line

          - tool: EDIT
            path: docs/TREE.md
            operation: replace
            start: "{{ loop.tree_line }}"
            end: "{{ loop.tree_line }}"
            version: "{{ loop.tree_version }}"
            input: |
              {{ loop.item }} - {{ loop.explain_resume }}
        is_false:
          - tool: EDIT
            path: docs/TREE.md
            operation: append
            input: |
              {{ loop.item }} - {{ loop.explain_resume }}

  - custom-tool: sort-tree
    input: []
    output: sorted_tree

  - tool: WRITE
    path: docs/TREE.md
    input: "{{ outputs.sorted_tree }}"
    force: true

  - tool: AWAIT

  - custom-tool: git-add
    input: []
