version: 1

steps:
  - tool: TREE
    output: tree

  - tool: LOOP
    input: "{{ outputs.tree }}"
    iter:
      - tool: READ
        input: "{{ loop.item }}"
        output: content
      - agent: code-explainer
        input: |
          "Código de um projeto Rust:"
          "{{ loop.content }}"
        output: explain
