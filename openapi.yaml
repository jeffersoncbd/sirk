openapi: 3.1.0
info:
  title: S.I.R.K. HTTP API
  version: 0.1.0
  description: |
    HTTP interface for the S.I.R.K. coding-agent service.

    The service has no authentication or TLS. Bind it only to a trusted
    network. Paths supplied in `directory` identify directories as seen by the
    host running S.I.R.K.; they are not resolved relative to the client.

    Requests to an unknown path return `404` with `{"error":"Not found"}`.
    A method other than the documented method returns `405` with
    `{"error":"Method not allowed"}`. JSON API responses use
    `application/json; charset=utf-8`; the document and UI routes return plain
    text and HTML respectively.
servers:
  - url: http://127.0.0.1:8080
    description: Default address used by `sirk http`.
paths:
  /openapi.yaml:
    get:
      summary: Download the OpenAPI specification
      description: Returns the complete specification served by this S.I.R.K. binary as plain UTF-8 text.
      operationId: getOpenApiDocument
      responses:
        '200':
          description: The OpenAPI document.
          content:
            text/plain:
              schema:
                type: string
                contentMediaType: application/yaml
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /swagger:
    get:
      summary: Open the Swagger UI
      description: Returns an HTML page that loads Swagger UI and configures it to display `/openapi.yaml`.
      operationId: getSwaggerUi
      responses:
        '200':
          description: The Swagger UI HTML page.
          content:
            text/html:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /health:
    get:
      summary: Check whether the service is available
      operationId: health
      responses:
        '200':
          description: The service accepted the health-check request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/agent/run:
    post:
      summary: Run a named agent
      description: |
        Loads the agent definition from `.agents/<agent>.md` below the supplied
        directory and runs it with the literal `input` string. Template-like
        content in `input`, including `{{ ... }}`, is passed through unchanged.
        The result is the agent's final response after any enabled tool requests
        have been handled.
      operationId: runAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
            example:
              directory: /workspace/project
              agent: code-explainer
              input: Explain src/lib.rs.
      responses:
        '200':
          description: The agent completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
              example:
                result: The module exposes the public S.I.R.K. API.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ExecutionError'
  /v1/git/status:
    post:
      summary: List changed paths below a directory
      description: |
        Returns sorted, unique relative UTF-8 paths for modified, untracked,
        and deleted regular files in the Git project below `directory`.
        Paths hidden by `.treeignore` are excluded. The requested directory
        must exist and be within a Git working tree visible to the server.
      operationId: gitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryRequest'
            example:
              directory: /workspace/project
      responses:
        '200':
          description: Changed paths were listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatusResponse'
              example:
                paths:
                  - src/lib.rs
                  - README.md
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ExecutionError'
  /v1/git/add:
    post:
      summary: Stage all changes below a directory
      description: |
        Runs Git add for every change below `directory`, including deletions.
        The requested directory must exist and be within a Git working tree
        visible to the server.
      operationId: gitAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryRequest'
            example:
              directory: /workspace/project
      responses:
        '200':
          description: All changes below the requested directory were staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: ok
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ExecutionError'
components:
  schemas:
    AgentRunRequest:
      type: object
      additionalProperties: false
      required:
        - directory
        - agent
        - input
      properties:
        directory:
          type: string
          description: Absolute or otherwise server-resolvable execution directory.
          examples:
            - /workspace/project
        agent:
          type: string
          description: Identifier of the `.agents/<agent>.md` definition to run.
          examples:
            - code-explainer
        input:
          type: string
          description: Literal text passed to the agent without template expansion.
          examples:
            - Explain src/lib.rs.
    DirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - directory
      properties:
        directory:
          type: string
          description: Absolute or otherwise server-resolvable directory within a Git working tree.
          examples:
            - /workspace/project
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
          description: Fixed success indicator.
    AgentRunResponse:
      type: object
      additionalProperties: false
      required:
        - result
      properties:
        result:
          type: string
          description: Final text returned by the executed agent.
    GitStatusResponse:
      type: object
      additionalProperties: false
      required:
        - paths
      properties:
        paths:
          type: array
          description: Sorted, unique paths relative to the requested directory.
          items:
            type: string
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
          description: Fixed success indicator.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
  responses:
    InvalidRequest:
      description: The body is unreadable, invalid JSON, missing a required field, or contains an unknown field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Invalid request
    ExecutionError:
      description: The requested agent or Git operation could not be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: An operation-specific error message.
    MethodNotAllowed:
      description: The path exists but does not accept the HTTP method used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Method not allowed
