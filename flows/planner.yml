version: 1

steps:

  - tool: ASK
    input: Qual o slug do plano (nome para a pasta)?
    output: plan_slug

  - custom-tool: folder-exists
    input: "plans/{{ outputs.plan_slug }}"
    output: plan_exists

  - tool: IF
    input: "{{ outputs.plan_exists }}"
    is_true:
      - tool: READ
        input: "plans/{{ outputs.plan_slug }}"
        output: plan
    is_false:
      - tool: READ
        input: Cargo.toml
        output: cargo_toml

      - agent: planner
        input: |
          Conteúdo do arquivo Cargo.toml:
          {{ outputs.cargo_toml }}\n
        output: plan
  
      - tool: WRITE
        path: "PLAN.md"
        input: "{{ outputs.plan }}"
