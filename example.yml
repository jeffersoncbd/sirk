version: 1

steps:
  - tool: TREE
    output: tree

  - tool: LOOP
    input: "{{ outputs.tree }}"
    iter:

      - tool: READ
        input: "{{ loop.item }}"
        output: content

      - custom-tool: doc-name
        input:
          - "{{ loop.item }}"
        output: doc_name

      - agent: code-explainer
        input: "{{ loop.content }}"
        output: explain

      - tool: WRITE
        path: "{{ loop.doc_name }}"
        input: "{{ loop.explain }}"
