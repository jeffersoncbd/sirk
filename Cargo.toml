[package]
name = "sirk"
version = "0.1.0"
edition = "2024"
description = "S.I.R.K. — a provider-neutral coding-agent service"

[lib]
name = "sirk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dotenvy = "0.15"
sha2 = "0.10"
sirk-sdk = { git = "https://github.com/jeffersoncbd/sirk-rust-sdk", version = "0.3.1" }
similar = "2"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
utoipa = { version = "6", features = ["yaml"] }
utoipa-axum = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "sirk"
path = "src/main.rs"
